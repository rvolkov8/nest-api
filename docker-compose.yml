version: '3.5'

services:
  db:
    image: postgres
    restart: always
    container_name: postgres
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:alpine3.16
    container_name: redis
    env_file: .env
    command: >
      --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    ports:
      - "6379:6379"
    restart: unless-stopped
